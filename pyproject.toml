[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tts-hub"
version = "0.2.9"
description = "把国内多家支持声音克隆的 TTS API 收敛成一套统一调用接口"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Diderde" }]
keywords = ["tts", "voice-clone", "minimax", "stepfun", "zhipu"]
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# P2 出口层：FastAPI 的 Form/File 解析依赖 python-multipart
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",  # TestClient 需要
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
tts-hub = "tts_hub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tts_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:tts_hub.*"]

# ---- 静态检查 --------------------------------------------------------
# "代码无误"的判据之一：ruff 零告警 + mypy 零错误。
# 两个配置都刻意开得比较实（含 E501 与 disallow_untyped_defs），不是摆设。

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle 错误
    "W",    # pycodestyle 告警
    "F",    # pyflakes
    "I",    # isort（导入顺序）
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff 自有规则
]
ignore = [
    "RUF001",  # 字符串里的"歧义"全角字符：本项目大量中文注释/文案，属误报
    "RUF002",  # 同上（docstring）
    "RUF003",  # 同上（注释）
    "SIM108",  # 三元表达式：强制改会降低可读性
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # 测试里允许 assert False 之类的写法
# FastAPI 要求 File()/Form()/Depends() 作为参数默认值调用，B008 在此属框架惯用法
"tts_hub/server/app.py" = ["B008"]
"tts_hub/server/models.py" = ["RUF012"]

[tool.mypy]
python_version = "3.11"
files = ["tts_hub", "tests"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
# 默认不强制标注，改为对源码目录收紧（见下面的 override）。
# 这样写是因为 tests/ 没有 __init__.py，mypy 把它们当顶层模块，按目录写模式容易不生效。
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# 源码必须带完整标注——这才是"类型检查"真正要守的边界
module = ["tts_hub.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
